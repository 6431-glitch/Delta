name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Swift contracts
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run Swift package tests
        run: swift test
      - name: Check AltStore publishing contracts
        run: |
          bash -n Scripts/AltStore/archive.sh
          python3 -m unittest discover -s Scripts/AltStore -p 'test_*.py'

  device-archive:
    name: Dependency checkout and iOS release archive
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - name: Check out exact submodule commits
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: 'git@github.com:'
          GIT_TERMINAL_PROMPT: 0
        run: |
          if ! git submodule update --init --recursive; then
            echo '::error::Could not fetch a pinned submodule commit. Publish it to its configured remote and verify recursive checkout; see Docs/GitHubActions.md.'
            exit 1
          fi
          git submodule status --recursive
      - name: Verify unsigned Release device archive
        run: |
          xcodebuild -workspace Delta.xcworkspace -scheme Delta -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/delta-build" \
            -archivePath "$RUNNER_TEMP/Delta.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
